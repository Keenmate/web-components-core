<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Test — keepScrollAcrossMove</title>
    <link rel="stylesheet" href="test-fixtures.css">
</head>
<body>
    <h1>keep-scroll fixture</h1>
    <p>Targeted by <code>e2e/keep-scroll.spec.ts</code>: two list components, one keeps its scroll across a DOM move.</p>
    <div id="a"><fx-scroll-list id="kept" data-keep></fx-scroll-list><fx-scroll-list id="plain"></fx-scroll-list></div>
    <div id="b"></div>

    <script type="module">
        import { BlissElement, define, keepScrollAcrossMove } from '/src/index.ts';
        class FxScrollList extends BlissElement {
            static inputs = [];
            constructor() {
                super();
                const root = this.attachShadow({ mode: 'open' });
                root.innerHTML = `<div class="list" style="height:120px;width:200px;overflow:auto;border:1px solid #999">
                    ${Array.from({ length: 100 }, (_, i) => `<div style="height:24px">Row ${i}</div>`).join('')}</div>`;
                this.list = root.querySelector('.list');
                if (this.hasAttribute('data-keep')) keepScrollAcrossMove(this, () => [this.list]);
            }
        }
        define('fx-scroll-list', FxScrollList);
    </script>
</body>
</html>
