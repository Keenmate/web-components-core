<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Test — createLayer + drawer preset</title>
    <link rel="stylesheet" href="test-fixtures.css">
    <style>
        :root { --fx-cover-bg: rgb(0, 120, 212); }
        .clip { width: 260px; height: 120px; overflow: hidden; border: 1px solid #999; position: relative; z-index: 1; }
        .covering { position: relative; z-index: 50; background: #fde; height: 40px; margin-top: -20px; }
        .transformed { transform: translateX(30px); margin-top: 20px; }
    </style>
</head>
<body>
    <h1>layer fixture</h1>
    <p>Targeted by <code>e2e/layer.spec.ts</code>.</p>
    <div class="clip"><fx-layer-host id="host" data-theme="dark" style="--fx-instance-border: red; font-family: monospace"></fx-layer-host></div>
    <div class="covering">a neighbour with z-index 50</div>
    <div class="transformed" id="transformed"></div>
    <fx-layer-styled id="styled"></fx-layer-styled>
    <button id="open-drawer">open drawer</button>
    <button id="open-drawer-rtl">open drawer (rtl, start)</button>
    <button id="open-panel-drawer">open non-modal drawer</button>
    <button id="open-sheet">open full-screen sheet</button>
    <input id="page-field" aria-label="page field">

    <script type="module">
        import { startModalSession, startPanelSession, animateOut, SHEET_CHROME_CSS, adoptStyles, createSheetHeader, registerComponent, createCustomStyles } from '/src/index.ts';
        import { createLayer } from '/src/positioning/index.ts';

        customElements.define('fx-layer-host', class extends HTMLElement {
            connectedCallback() {
                this.attachShadow({ mode: 'open' }).innerHTML = '<div style="height:200px;background:#eee">host content</div>';
            }
        });
        const host = document.getElementById('host');
        const CSS = `.cover { background: var(--fx-cover-bg); color: white; display: grid; place-items: center; }
                     :host([data-theme="dark"]) .cover { outline: 3px solid black; }
                     @layer component { :host([data-theme="dark"]) { color-scheme: dark; } }
                     .cover { border-color: var(--fx-instance-border, transparent); border-style: solid; border-width: 2px; }`;
        window.__openCover = () => {
            const layer = createLayer(host, { css: CSS, className: 'cover', cssVars: ['--fx-instance-border'] });
            layer.element.textContent = 'drop files here';
            const r = host.getBoundingClientRect();
            layer.place({ top: r.top, left: r.left, width: r.width, height: 120 });
            window.__layer = layer;
        };
        window.__openInTransformed = () => {
            const box = document.getElementById('transformed');
            const layer = createLayer(host, { container: box, className: 'cover', css: CSS });
            layer.place({ top: 300, left: 100, width: 50, height: 20 });
            window.__layer2 = layer;
        };

        // G2: a component's custom CSS (page-wide + instance) reaches its layer via customStylesOptions.
        class FxLayerStyled extends HTMLElement {
            instanceCss = '.ghost { color: rgb(255, 0, 0); }';
            connectedCallback() {
                const root = this.attachShadow({ mode: 'open' });
                this.customStylesOptions = { cssClass: 'fx-custom', getContext: () => ({}), getInstanceStyles: () => ({ css: this.instanceCss }) };
                this.styles = createCustomStyles(this, root, this.customStylesOptions);
            }
            setInstanceCss(css) { this.instanceCss = css; this.styles.refresh(); }
        }
        registerComponent('fx-layer-styled', FxLayerStyled, { config: { name: 'fx', version: '0.0.0' } });
        window.__openStyledLayer = () => {
            const el = document.getElementById('styled');
            const layer = createLayer(el, { className: 'ghost', customStylesOptions: el.customStylesOptions });
            layer.element.textContent = 'ghost';
            layer.place({ top: 400, left: 10, width: 100, height: 30 });
            window.__styledLayer = layer;
        };

        adoptStyles(document, SHEET_CHROME_CSS);
        const openDrawer = (side, dir) => {
            const panel = document.createElement('div');
            panel.className = `km-drawer km-drawer--${side}`;
            panel.id = 'drawer';
            if (dir) panel.dir = dir;
            panel.innerHTML = '<button id="drawer-first">first</button><p>drawer</p><button id="drawer-close">close</button>';
            document.body.append(panel);
            const close = () => {
                session.end();
                animateOut([panel], { className: 'km-drawer--closing', doneCallback: () => panel.remove() });
            };
            const session = startModalSession(panel, { backdrop: true, dismissCallback: close });
            panel.querySelector('#drawer-close').addEventListener('click', close);
        };
        document.getElementById('open-drawer').addEventListener('click', () => openDrawer('end'));
        document.getElementById('open-drawer-rtl').addEventListener('click', () => openDrawer('start', 'rtl'));
        window.__panelReasons = [];
        document.getElementById('open-panel-drawer').addEventListener('click', (e) => {
            const panel = document.createElement('div');
            panel.className = 'km-drawer km-drawer--end';
            panel.id = 'panel-drawer';
            panel.innerHTML = '<p>uploads</p><button id="panel-close">close</button>';
            document.body.append(panel);
            const close = () => {
                session.end();
                animateOut([panel], { className: 'km-drawer--closing', doneCallback: () => panel.remove() });
            };
            const session = startPanelSession(panel, {
                trigger: e.currentTarget,
                dismissCallback: (reason) => { window.__panelReasons.push(reason); close(); },
            });
            panel.querySelector('#panel-close').addEventListener('click', close);
        });
        document.getElementById('open-sheet').addEventListener('click', () => {
            const sheet = document.createElement('div');
            sheet.className = 'km-sheet';
            sheet.id = 'sheet';
            const body = document.createElement('div');
            body.className = 'km-sheet-body';
            body.id = 'sheet-body';
            body.innerHTML = Array.from({ length: 60 }, (_, i) => `<button class="sheet-row">row ${i + 1}</button><br>`).join('');
            const close = () => {
                session.end();
                animateOut([sheet], { className: 'km-sheet--closing', doneCallback: () => sheet.remove() });
            };
            sheet.append(createSheetHeader({ title: 'Sheet', closeLabel: 'Close', closeCallback: close }).header, body);
            document.body.append(sheet);
            const session = startModalSession(sheet, { dismissCallback: close, shouldFitToVisibleViewport: true });
        });
    </script>
</body>
</html>
