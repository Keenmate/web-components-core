<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test — tooltip (core /positioning)</title>
    <style>
        body { margin: 0; font-family: system-ui, sans-serif; }

        .trigger {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            background: #e0e7ff;
            border: 1px solid #6366f1;
            font-size: 12px;
        }

        /* A big trigger: positioning the cursor well inside it (away from the
           top-left corner) lets the e2e assert the tooltip anchored to the
           CURSOR, not to the trigger's full rect (the old-bug fallback). */
        #follow-delay { left: 200px; top: 300px; width: 320px; height: 100px; }
        #basic        { left: 200px; top: 480px; width: 140px; height: 44px; }
        #focus-basic  { left: 200px; top: 560px; width: 140px; height: 44px; }

        .tt {
            position: fixed;
            top: 0;
            left: 0;
            background: #111827;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
        }
        .tt.is-visible { opacity: 1; }
    </style>
</head>
<body>
    <h1 style="font-size: 14px; margin: 12px 16px;">core /positioning tooltip fixtures</h1>
    <p style="margin: 0 16px; font-size: 12px; color: #555;">
        Targeted by <code>e2e/tooltip.spec.ts</code>.
    </p>

    <!-- follow-cursor WITH a show delay — the stationary-hover regression case. -->
    <div class="trigger" id="follow-delay" tabindex="0">follow-cursor + 400ms delay</div>

    <!-- plain hover tooltip, no delay. -->
    <div class="trigger" id="basic" tabindex="0">basic</div>

    <!-- keyboard-focus tooltip (no cursor). -->
    <button class="trigger" id="focus-basic">focus</button>

    <script type="module">
        import { createTooltip } from '/src/positioning/index.ts';

        createTooltip({
            trigger: document.getElementById('follow-delay'),
            content: 'following the cursor',
            cssClass: 'tt follow-tt',
            followCursor: true,
            delay: { show: 400, hide: 0 },
            placement: 'top',
        });

        createTooltip({
            trigger: document.getElementById('basic'),
            content: 'basic tooltip',
            cssClass: 'tt basic-tt',
            placement: 'top',
        });

        createTooltip({
            trigger: document.getElementById('focus-basic'),
            content: 'focus tooltip',
            cssClass: 'tt focus-tt',
            placement: 'top',
        });
    </script>
</body>
</html>
