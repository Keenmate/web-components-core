<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test — tooltip (core /positioning)</title>
    <style>
        body { margin: 0; font-family: system-ui, sans-serif; }

        .trigger {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            background: #e0e7ff;
            border: 1px solid #6366f1;
            font-size: 12px;
        }

        /* A big trigger: positioning the cursor well inside it (away from the
           top-left corner) lets the e2e assert the tooltip anchored to the
           CURSOR, not to the trigger's full rect (the old-bug fallback). */
        #follow-delay { left: 200px; top: 300px; width: 320px; height: 100px; }
        #basic        { left: 200px; top: 480px; width: 140px; height: 44px; }
        #focus-basic  { left: 200px; top: 560px; width: 140px; height: 44px; }
        #host-card    { left: 200px; top: 640px; width: 180px; height: 44px; }
        #cells        { position: absolute; left: 600px; top: 300px; }
        #still        { left: 400px; top: 480px; width: 140px; height: 44px; }
        #edge         { left: 600px; top: 2px; width: 140px; height: 30px; }

        /* G9b: tooltips on items inside scroll containers (shouldHideOnScroll). */
        .scroll-box { position: absolute; top: 480px; width: 200px; height: 120px; overflow: auto; border: 1px solid #999; }
        #scroll-box      { left: 900px; }
        #scroll-box-keep { left: 1120px; }
        .scroll-box .spacer-top { height: 40px; }
        .scroll-box .spacer-bottom { height: 400px; }
        .scroll-tt-body { max-height: 40px; overflow: auto; }

        .tt {
            position: fixed;
            top: 0;
            left: 0;
            background: #111827;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
        }
        .tt.is-visible { opacity: 1; }
    </style>
</head>
<body>
    <h1 style="font-size: 14px; margin: 12px 16px;">core /positioning tooltip fixtures</h1>
    <p style="margin: 0 16px; font-size: 12px; color: #555;">
        Targeted by <code>e2e/tooltip.spec.ts</code>.
    </p>

    <!-- follow-cursor WITH a show delay — the stationary-hover regression case. -->
    <div class="trigger" id="follow-delay" tabindex="0">follow-cursor + 400ms delay</div>

    <!-- plain hover tooltip, no delay. -->
    <div class="trigger" id="basic" tabindex="0">basic</div>

    <!-- keyboard-focus tooltip (no cursor). -->
    <button class="trigger" id="focus-basic">focus</button>

    <!-- BG2 / Q5: a focus-shown tooltip inside an open routed overlay (Escape closes the panel). -->
    <button id="panel-opener">open panel</button>
    <div id="panel" hidden><button class="trigger" id="panel-item">panel item</button></div>

    <!-- motion none on a section: the exit fade (and entry) are instant. -->
    <section data-motion="none"><div class="trigger" id="still" tabindex="0">motion none</div></section>

    <!-- placement top at the viewport's top edge: flips, data-placement says so. -->
    <div class="trigger" id="edge" tabindex="0">edge</div>

    <!-- G9b: shouldHideOnScroll (default true) vs false; the default one has scrollable content. -->
    <div class="scroll-box" id="scroll-box">
        <div class="spacer-top"></div><div id="scroll-item" tabindex="0">scroll item</div><div class="spacer-bottom"></div>
    </div>
    <div class="scroll-box" id="scroll-box-keep">
        <div class="spacer-top"></div><div id="scroll-keep" tabindex="0">keep on scroll</div><div class="spacer-bottom"></div>
    </div>

    <!-- a BlissElement that owns its tooltip: built in connect(), rebuilt on an on:'reinit' input. -->
    <fx-tooltip-host class="trigger" id="host-card" tooltip-text="A core tooltip">component trigger</fx-tooltip-host>

    <!-- delegated: ONE tooltip for the cells of a component's shadow root; cell 3 has no tooltip. -->
    <fx-cells id="cells"></fx-cells>

    <script type="module">
        import { createTooltip } from '/src/positioning/index.ts';
        import { BlissElement, define, toText } from '/src/index.ts';
        import { registerOverlay } from '/src/overlay/active-overlay.ts';

        class FxTooltipHost extends BlissElement {
            static inputs = [
                { configKey: 'tooltipText', attribute: 'tooltip-text', converter: toText({ default: 'tip' }), on: 'reinit' },
            ];
            #tip;
            #rebuild() {
                this.#tip?.destroy();
                this.#tip = createTooltip({ trigger: this, content: this.config.tooltipText, cssClass: 'tt host-tt', placement: 'top' });
            }
            reinit() { if (this.#tip) this.#rebuild(); }
            connect() { this.#rebuild(); }
            disconnect() { this.#tip?.destroy(); this.#tip = undefined; }
        }
        define('fx-tooltip-host', FxTooltipHost);

        // Delegated tooltip over a shadow root; `?tap` turns on toggle-on-tap (the phone test).
        class FxCells extends HTMLElement {
            connectedCallback() {
                const root = this.attachShadow({ mode: 'open' });
                root.innerHTML = `<style>
                    .row { display: flex; gap: 4px; }
                    .cell { width: 60px; height: 40px; display: grid; place-items: center; background: #fde68a; }
                    .tt { position: fixed; top: 0; left: 0; background: #111827; color: #fff; padding: 2px 6px; opacity: 0; pointer-events: none; }
                    .tt.is-visible { opacity: 1; }
                </style><div class="row">
                    <span class="cell" tabindex="0" data-tip="tip 1">1</span>
                    <span class="cell" tabindex="0" data-tip="tip 2"><b>2</b></span>
                    <span class="cell" tabindex="0">3</span>
                </div>`;
                window.cellsTip = createTooltip({
                    trigger: root,
                    selector: '.cell',
                    content: (cell) => cell.dataset.tip,
                    container: root,
                    cssClass: 'tt cells-tt',
                    delay: { show: 300 },
                    shouldToggleOnTap: location.search.includes('tap'),
                });
            }
        }
        customElements.define('fx-cells', FxCells);

        createTooltip({
            trigger: document.getElementById('follow-delay'),
            content: 'following the cursor',
            cssClass: 'tt follow-tt',
            shouldFollowCursor: true,
            delay: { show: 400, hide: 0 },
            placement: 'top',
        });

        createTooltip({
            trigger: document.getElementById('basic'),
            content: 'basic tooltip',
            cssClass: 'tt basic-tt',
            placement: 'top',
        });

        window.stillTip = createTooltip({
            trigger: document.getElementById('still'),
            content: 'no motion',
            cssClass: 'tt still-tt',
            placement: 'top',
        });

        window.edgeTip = createTooltip({
            trigger: document.getElementById('edge'),
            content: 'flipped',
            cssClass: 'tt edge-tt',
            placement: 'top',
        });

        // The routed panel: Escape closes it (overlay router) and returns focus to the opener.
        {
            const opener = document.getElementById('panel-opener');
            const panel = document.getElementById('panel');
            const overlay = registerOverlay(() => { panel.hidden = true; }, undefined, {
                getElement: () => panel,
                shouldCloseOnEscape: true,
            });
            opener.addEventListener('click', () => {
                panel.hidden = false;
                overlay.activate({ trigger: opener });
                document.getElementById('panel-item').focus();
            });
            createTooltip({ trigger: document.getElementById('panel-item'), content: 'panel tooltip', cssClass: 'tt panel-tt', placement: 'top' });
            // What a component sees after the router / tooltip: was the Escape consumed?
            window.escapes = [];
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.escapes.push(e.defaultPrevented); });
        }

        {
            const body = document.createElement('div');
            body.className = 'scroll-tt-body';
            body.innerHTML = Array.from({ length: 10 }, (_, i) => `line ${i + 1}`).join('<br>');
            window.scrollTip = createTooltip({
                trigger: document.getElementById('scroll-item'),
                content: body,
                cssClass: 'tt scroll-tt',
                placement: 'top',
            });
            window.scrollKeepTip = createTooltip({
                trigger: document.getElementById('scroll-keep'),
                content: 'stays on scroll',
                cssClass: 'tt scroll-keep-tt',
                placement: 'top',
                shouldHideOnScroll: false,
            });
        }

        createTooltip({
            trigger: document.getElementById('focus-basic'),
            content: 'focus tooltip',
            cssClass: 'tt focus-tt',
            placement: 'top',
        });
    </script>
</body>
</html>
