<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test — createPopover (core /positioning)</title>
    <link rel="stylesheet" href="test-fixtures.css">
    <style>
        #ref { width: 360px; }
        .fx-panel { background: #fff; border: 1px solid #6366f1; padding: 8px; }
    </style>
</head>
<body>
    <h1>createPopover fixture</h1>
    <p>Targeted by <code>e2e/popover.spec.ts</code>. The page wires the toggle + outside-click dismiss the way a component would.</p>

    <div class="fixture">
        <div class="fixture-label">popover (placement bottom-start, offset 6, matchWidth exact)</div>
        <button id="ref" type="button">Toggle popover (360px reference)</button>
    </div>

    <script type="module">
        import { createPopover } from '/src/positioning/index.ts';

        const ref = document.getElementById('ref');
        const panel = document.createElement('div');
        panel.className = 'fx-panel';
        panel.textContent = 'portaled panel';
        const pop = createPopover({ reference: ref, panel, placement: 'bottom-start', offset: 6, matchWidth: 'exact' });
        window.pop = pop;

        ref.addEventListener('click', () => (pop.isOpen ? pop.close() : pop.open()));
        document.addEventListener('click', (e) => {
            if (!pop.isOpen || e.target === ref || panel.contains(e.target)) return;
            pop.close();
        });
        document.body.dataset.ready = '';
    </script>
</body>
</html>
