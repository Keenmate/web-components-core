<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Test — createVirtualWindow</title>
    <link rel="stylesheet" href="test-fixtures.css">
    <style>
        .scroller { height: 300px; width: 320px; overflow: auto; border: 1px solid #999; }
        .row { height: 24px; box-sizing: border-box; border-bottom: 1px solid #eee; }
        .head { position: sticky; top: 0; z-index: 1; height: 40px; background: #ddd; }
        .tall { height: 1500px; }
    </style>
</head>
<body>
    <h1>virtual window fixture</h1>
    <p>Targeted by <code>e2e/virtual-window.spec.ts</code>: 10 000 rows, a sticky header inside the scroller.</p>
    <div class="scroller" id="list"><div class="head">header</div></div>
    <div class="tall"></div>

    <script type="module">
        import { createVirtualWindow } from '/src/index.ts';
        const list = document.getElementById('list');
        let renders = 0;
        window.__vw = createVirtualWindow(list, {
            getCount: () => 10000,
            rowHeight: 24,
            overscan: 3,
            insetTop: () => list.querySelector('.head').offsetHeight,
            render: ({ start, end, window }) => {
                renders++;
                let html = '';
                for (let i = start; i < end; i++) html += `<div class="row" data-index="${i}">Row ${i}</div>`;
                window.innerHTML = html;
            },
        });
        window.__renders = () => renders;
    </script>
</body>
</html>
