<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Test — renderSlot</title>
    <link rel="stylesheet" href="test-fixtures.css">
</head>
<body>
    <h1>renderSlot fixture</h1>
    <p>Targeted by <code>e2e/render-slot.spec.ts</code>.</p>
    <div id="slot"></div>
    <output id="calls"></output>

    <script type="module">
        import { renderSlot } from '/src/index.ts';
        const slot = document.getElementById('slot');
        let calls = 0;
        let mode = 'custom';
        let version = 1;
        const hook = () => {
            calls++;
            document.getElementById('calls').textContent = String(calls);
            return mode === 'custom' ? '<input id="inner" aria-label="inner">' : mode === 'hide' ? false : null;
        };
        window.__paint = () => renderSlot(slot, hook, { memoKey: `${mode}@${version}`, renderDefault: (el) => (el.textContent = 'default text') });
        window.__set = (m, v) => { mode = m; version = v; window.__paint(); };
        window.__paint();
    </script>
</body>
</html>
